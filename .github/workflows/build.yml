name: Build and publish Kodi repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate Python and XML
        run: |
          python -m py_compile plugin.video.strumyk/main.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ['plugin.video.strumyk/addon.xml', 'repository.strumyk/addon.xml', 'addons.xml']:
              ET.parse(path)
              print('XML OK:', path)
          PY
      - name: Build repository metadata and ZIPs
        run: |
          python - <<'PY'
          import hashlib, pathlib, shutil, zipfile
          from xml.etree import ElementTree as ET

          def addon_zip(src, out):
              src, out = pathlib.Path(src), pathlib.Path(out)
              if out.exists(): out.unlink()
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(src.rglob('*')):
                      if p.is_file() and p.suffix.lower() != '.zip':
                          z.write(p, p.as_posix())

          plugin_zip = pathlib.Path('plugin.video.strumyk/plugin.video.strumyk-0.1.0.zip')
          repo_zip = pathlib.Path('repository.strumyk/repository.strumyk-1.0.0.zip')
          addon_zip('plugin.video.strumyk', plugin_zip)
          addon_zip('repository.strumyk', repo_zip)

          root = ET.Element('addons')
          for manifest in ['plugin.video.strumyk/addon.xml', 'repository.strumyk/addon.xml']:
              root.append(ET.parse(manifest).getroot())
          ET.ElementTree(root).write('addons.xml', encoding='utf-8', xml_declaration=True)
          pathlib.Path('addons.xml.sha256').write_text(hashlib.sha256(pathlib.Path('addons.xml').read_bytes()).hexdigest() + '\n', encoding='utf-8')

          site = pathlib.Path('site')
          if site.exists(): shutil.rmtree(site)
          (site / 'plugin.video.strumyk').mkdir(parents=True)
          (site / 'repository.strumyk').mkdir(parents=True)
          shutil.copy2('addons.xml', site / 'addons.xml')
          shutil.copy2('addons.xml.sha256', site / 'addons.xml.sha256')
          shutil.copy2(plugin_zip, site / 'plugin.video.strumyk' / plugin_zip.name)
          shutil.copy2(repo_zip, site / 'repository.strumyk' / repo_zip.name)
          shutil.copy2('plugin.video.strumyk/icon.svg', site / 'plugin.video.strumyk' / 'icon.svg')
          shutil.copy2('plugin.video.strumyk/icon.svg', site / 'repository.strumyk' / 'icon.svg')
          print('Build complete')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
