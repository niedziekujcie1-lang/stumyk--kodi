name: Build and publish Kodi repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate Python and XML
        run: |
          python -m py_compile plugin.video.strumyk/main.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ['plugin.video.strumyk/addon.xml', 'repository.strumyk/addon.xml']:
              ET.parse(path)
              print('XML OK:', path)
          PY
      - name: Build repository metadata and ZIPs
        run: |
          python - <<'PY'
          import hashlib, pathlib, shutil, zipfile
          from xml.etree import ElementTree as ET

          def addon_zip(src, out):
              src, out = pathlib.Path(src), pathlib.Path(out)
              if out.exists(): out.unlink()
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(src.rglob('*')):
                      if p.is_file() and p.suffix.lower() != '.zip':
                          z.write(p, p.as_posix())

          plugin_manifest = ET.parse('plugin.video.strumyk/addon.xml').getroot()
          repo_manifest = ET.parse('repository.strumyk/addon.xml').getroot()
          plugin_id = plugin_manifest.attrib['id']
          plugin_version = plugin_manifest.attrib['version']
          repo_id = repo_manifest.attrib['id']
          repo_version = repo_manifest.attrib['version']

          plugin_zip = pathlib.Path('plugin.video.strumyk') / f'{plugin_id}-{plugin_version}.zip'
          repo_zip = pathlib.Path('repository.strumyk') / f'{repo_id}-{repo_version}.zip'
          addon_zip('plugin.video.strumyk', plugin_zip)
          addon_zip('repository.strumyk', repo_zip)

          root = ET.Element('addons')
          root.append(plugin_manifest)
          root.append(repo_manifest)
          ET.ElementTree(root).write('addons.xml', encoding='utf-8', xml_declaration=True)
          data = pathlib.Path('addons.xml').read_bytes()
          pathlib.Path('addons.xml.sha256').write_text(hashlib.sha256(data).hexdigest() + '\n', encoding='utf-8')
          pathlib.Path('addons.xml.md5').write_text(hashlib.md5(data).hexdigest() + '\n', encoding='utf-8')

          site = pathlib.Path('site')
          if site.exists(): shutil.rmtree(site)
          (site / plugin_id).mkdir(parents=True)
          (site / repo_id).mkdir(parents=True)
          shutil.copy2('addons.xml', site / 'addons.xml')
          shutil.copy2('addons.xml.sha256', site / 'addons.xml.sha256')
          shutil.copy2('addons.xml.md5', site / 'addons.xml.md5')
          shutil.copy2(plugin_zip, site / plugin_id / plugin_zip.name)
          shutil.copy2(repo_zip, site / repo_id / repo_zip.name)
          shutil.copy2('plugin.video.strumyk/icon.svg', site / plugin_id / 'icon.svg')
          shutil.copy2('repository.strumyk/icon.svg', site / repo_id / 'icon.svg')
          (site / 'index.html').write_text('<!doctype html><html><head><meta charset="utf-8"><title>Strumyk Kodi Repository</title></head><body><h1>Strumyk Kodi Repository</h1><p>Kodi repository files.</p></body></html>', encoding='utf-8')
          print('Build complete:', plugin_zip, repo_zip)
          PY
      - name: Verify generated repository files
        run: |
          python - <<'PY'
          import pathlib, zipfile
          from xml.etree import ElementTree as ET
          ET.parse('site/addons.xml')
          assert pathlib.Path('site/addons.xml.md5').read_text().strip()
          assert pathlib.Path('site/addons.xml.sha256').read_text().strip()
          for p in pathlib.Path('site').glob('*/*.zip'):
              with zipfile.ZipFile(p) as z:
                  names = z.namelist()
                  assert p.parent.name + '/addon.xml' in names
          print('Repository package verification OK')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Test public GitHub Pages files
        run: |
          set -euxo pipefail
          base='https://niedziekujcie1-lang.github.io/stumyk--kodi'
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --retry-delay 2 "$base/addons.xml" -o addons.xml; then break; fi
            sleep 5
          done
          test -s addons.xml
          grep -q 'plugin.video.strumyk' addons.xml
          grep -q 'repository.strumyk' addons.xml
          curl -fsSI --retry 3 --retry-delay 2 "$base/plugin.video.strumyk/plugin.video.strumyk-0.1.0.zip"
          curl -fsSI --retry 3 --retry-delay 2 "$base/repository.strumyk/repository.strumyk-1.0.1.zip"
          curl -fsSL --retry 3 --retry-delay 2 "$base/addons.xml.md5" | grep -Eq '^[0-9a-fA-F]{32}$'
          echo 'GitHub Pages smoke test: OK'
