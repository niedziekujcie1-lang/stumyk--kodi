name: Build and publish Kodi repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Python and XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path('plugin.video.strumyk/main.py').read_text(encoding='utf-8')
          compile(source, 'plugin.video.strumyk/main.py', 'exec')
          for path in [
              'plugin.video.strumyk/addon.xml',
              'plugin.video.strumyk/resources/settings.xml',
              'repository.strumyk/addon.xml',
          ]:
              ET.parse(path)
              print('XML OK:', path)
          PY

      - name: Validate Kodi settings identifiers
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('plugin.video.strumyk/resources/settings.xml').getroot()
          assert root.tag == 'settings'
          assert root.attrib.get('version') == '1'
          section = root.find("section[@id='plugin.video.strumyk']")
          assert section is not None
          settings = section.findall('.//setting')
          ids = [s.attrib['id'] for s in settings]
          assert len(ids) == len(set(ids))
          categories = {g.attrib['id'] for g in section.findall('.//group')}
          expected = {'football', 'basketball', 'volleyball', 'tennis', 'motorsport', 'combat', 'hockey', 'other'}
          assert categories == expected
          for setting_id in ids:
              assert setting_id.startswith(('label_', 'url_'))
          print('Settings validation OK:', len(ids), 'settings')
          PY

      - name: Build repository metadata and ZIPs
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil, struct, zlib, zipfile
          from xml.etree import ElementTree as ET

          def write_png(path, size=256):
              w = h = size
              rows = []
              for y in range(h):
                  row = bytearray([0])
                  for x in range(w):
                      r, g, b = 17, 24, 39
                      if 38 <= x < 218 and 76 <= y < 180:
                          r, g, b = 255, 255, 255
                      if 54 <= x < 202 and 92 <= y < 164:
                          r, g, b = 17, 24, 39
                      if 108 <= x < 160 and 108 <= y < 149:
                          width = 52 - abs(y - 128) * 2
                          if width > 0 and x <= 108 + width:
                              r, g, b = 255, 255, 255
                      row.extend((r, g, b))
                  rows.append(bytes(row))
              raw = b''.join(rows)
              def chunk(kind, payload):
                  return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff)
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(raw, 9))
              png += chunk(b'IEND', b'')
              Path(path).write_bytes(png)

          write_png('plugin.video.strumyk/icon.png')
          write_png('repository.strumyk/icon.png')

          EXCLUDED = {'.pyc', '.pyo', '.zip'}
          EXCLUDED_DIRS = {'__pycache__'}

          def addon_zip(src, out):
              src, out = Path(src), Path(out)
              if out.exists(): out.unlink()
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(src.rglob('*')):
                      if not p.is_file():
                          continue
                      if any(part in EXCLUDED_DIRS for part in p.parts):
                          continue
                      if p.suffix.lower() in EXCLUDED:
                          continue
                      z.write(p, p.as_posix())

          plugin_manifest = ET.parse('plugin.video.strumyk/addon.xml').getroot()
          repo_manifest = ET.parse('repository.strumyk/addon.xml').getroot()
          plugin_id = plugin_manifest.attrib['id']
          plugin_version = plugin_manifest.attrib['version']
          repo_id = repo_manifest.attrib['id']
          repo_version = repo_manifest.attrib['version']

          plugin_zip = Path('plugin.video.strumyk') / f'{plugin_id}-{plugin_version}.zip'
          repo_zip = Path('repository.strumyk') / f'{repo_id}-{repo_version}.zip'
          addon_zip('plugin.video.strumyk', plugin_zip)
          addon_zip('repository.strumyk', repo_zip)

          root = ET.Element('addons')
          root.append(plugin_manifest)
          root.append(repo_manifest)
          ET.ElementTree(root).write('addons.xml', encoding='utf-8', xml_declaration=True)
          data = Path('addons.xml').read_bytes()
          Path('addons.xml.sha256').write_text(hashlib.sha256(data).hexdigest() + '\n', encoding='utf-8')
          Path('addons.xml.md5').write_text(hashlib.md5(data).hexdigest() + '\n', encoding='utf-8')

          site = Path('site')
          if site.exists(): shutil.rmtree(site)
          (site / plugin_id).mkdir(parents=True)
          (site / repo_id).mkdir(parents=True)
          shutil.copy2('addons.xml', site / 'addons.xml')
          shutil.copy2('addons.xml.sha256', site / 'addons.xml.sha256')
          shutil.copy2('addons.xml.md5', site / 'addons.xml.md5')
          shutil.copy2(plugin_zip, site / plugin_id / plugin_zip.name)
          shutil.copy2(repo_zip, site / repo_id / repo_zip.name)
          shutil.copy2('plugin.video.strumyk/icon.png', site / plugin_id / 'icon.png')
          shutil.copy2('repository.strumyk/icon.png', site / repo_id / 'icon.png')
          (site / 'index.html').write_text('<!doctype html><html><head><meta charset="utf-8"><title>Strumyk Kodi Repository</title></head><body><h1>Strumyk Kodi Repository</h1><p>Kodi repository files.</p></body></html>', encoding='utf-8')
          print('Build complete:', plugin_zip, repo_zip)
          PY

      - name: Verify generated repository files
        run: |
          python - <<'PY'
          import pathlib, zipfile
          from xml.etree import ElementTree as ET
          root = ET.parse('site/addons.xml').getroot()
          addons = {a.attrib['id']: a.attrib['version'] for a in root.findall('addon')}
          assert addons['plugin.video.strumyk'] == '0.1.5'
          assert addons['repository.strumyk'] == '1.0.7'
          assert pathlib.Path('site/addons.xml.sha256').read_text().strip()
          assert pathlib.Path('site/addons.xml.md5').read_text().strip()
          for p in pathlib.Path('site').glob('*/*.zip'):
              with zipfile.ZipFile(p) as z:
                  names = set(z.namelist())
                  root_name = p.parent.name
                  assert f'{root_name}/addon.xml' in names
                  assert f'{root_name}/icon.png' in names
                  if root_name == 'plugin.video.strumyk':
                      assert f'{root_name}/main.py' in names
                      assert f'{root_name}/resources/settings.xml' in names
                  assert not any(n.endswith(('.pyc', '.pyo')) or '/__pycache__/' in n for n in names)
          print('Repository package verification OK')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Test public GitHub Pages files
        run: |
          set -euxo pipefail
          base='https://niedziekujcie1-lang.github.io/stumyk--kodi'
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --retry-delay 2 "$base/addons.xml" -o addons.xml; then break; fi
            sleep 5
          done
          test -s addons.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('addons.xml').getroot()
          addons = {a.attrib['id']: a.attrib['version'] for a in root.findall('addon')}
          assert addons['plugin.video.strumyk'] == '0.1.5'
          assert addons['repository.strumyk'] == '1.0.7'
          PY
          curl -fsSL --retry 3 --retry-delay 2 "$base/addons.xml.sha256" -o addons.xml.sha256
          python - <<'PY'
          import hashlib, pathlib
          data = pathlib.Path('addons.xml').read_bytes()
          expected = pathlib.Path('addons.xml.sha256').read_text().split()[0]
          assert hashlib.sha256(data).hexdigest() == expected
          PY
          curl -fsSL --retry 3 --retry-delay 2 "$base/plugin.video.strumyk/plugin.video.strumyk-0.1.5.zip" -o plugin.zip
          curl -fsSL --retry 3 --retry-delay 2 "$base/repository.strumyk/repository.strumyk-1.0.7.zip" -o repo.zip
          unzip -tq plugin.zip
          unzip -tq repo.zip
          python - <<'PY'
          import zipfile
          checks = [
              ('plugin.zip', 'plugin.video.strumyk', ['plugin.video.strumyk/addon.xml', 'plugin.video.strumyk/main.py', 'plugin.video.strumyk/icon.png', 'plugin.video.strumyk/resources/settings.xml']),
              ('repo.zip', 'repository.strumyk', ['repository.strumyk/addon.xml', 'repository.strumyk/icon.png']),
          ]
          for filename, root_name, required in checks:
              with zipfile.ZipFile(filename) as z:
                  names = set(z.namelist())
                  for path in required:
                      assert path in names, (filename, path)
                  assert not any(n.endswith(('.pyc', '.pyo')) or '/__pycache__/' in n for n in names)
          print('Public ZIP download and integrity test: OK')
          PY
          echo 'GitHub Pages smoke test: OK'
